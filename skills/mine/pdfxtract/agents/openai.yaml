interface:
  display_name: "Pdfxtract"
  short_description: "PDF extraction via the pdfxtract CLI, which pairs pdftotext (faithful math/accents) with liteparse (Markdown structure, OCR). Use when extracting or parsing text from a PDF, summarizing a paper/document, listing a PDF's sections, or pulling one section out by name."
policy:
  allow_implicit_invocation: true
