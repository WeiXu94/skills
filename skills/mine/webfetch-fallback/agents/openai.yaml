interface:
  display_name: "Webfetch Fallback"
  short_description: "Fetch web content the built-in WebFetch tool can't reach — X/Twitter posts (WebFetch 402s/451s on these), WeChat articles, github.com repo/pages, paywalled or JS-heavy pages — using curl against dedicated APIs and read proxies. Also the robust path for GitHub files. Use when WebFetch fails or returns a login/paywall page, or for any x.com / twitter.com or mp.weixin.qq.com URL."
policy:
  allow_implicit_invocation: true
